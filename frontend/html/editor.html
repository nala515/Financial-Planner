<!DOCTYPE html>
<html>
<head>
    <title>Editor - Finance Tracker</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="/static/favicon.png">
</head>
<body>

<div id="nav-placeholder"></div>
<h1>Edit Database</h1>

<!-- Top Section: Master Account Selection -->
<div class="editor-header">
    <label for="account-selector">Select account to edit:</label>
    <select id="account-selector">
        <option value="">Select an account</option>
    </select>
    <div class="form-actions">
        <button type="submit">Save Info</button>
        <button type="button" id="reset-account-details">Reset</button>
    </div>
</div>

<!-- Main Section: Three-Card Dashboard -->
<div class="editor-dashboard">
    <!-- Card 1: Basic Account Info -->
    <form id="account-form" class="editor-card">
        <h3>Account Details</h3>
        <label for="account-name">Name</label>
        <input id="account-name" name="name" type="text" required>

        <label for="account-category">Category</label>
        <select id="account-category" name="category">
            <option value="Cash">Cash</option>
            <option value="Investment">Investment</option>
            <option value="Retirement">Retirement</option>
            <option value="HSA">HSA</option>
            <option value="529">529</option>
        </select>

        <label class="checkbox-row">
            <input id="account-shared" name="shared" type="checkbox"> Shared account
        </label>
        <p id="account-form-status" class="form-status"></p>
    </form>

    <!-- Card 2: Balances Editor -->
    <div id="balances-editor" class="editor-card">
        <h3>Monthly Balances</h3>
        <form id="balances-update-form">
            <div id="balances-list-container" class="scroll-list">
                <!-- Inputs generated by JS -->
            </div>
            <button type="submit">Update Balances</button>
        </form>
    </div>

    <!-- Card 3: Contributions Editor -->
    <div id="contributions-editor" class="editor-card">
        <h3>Monthly Contributions</h3>
        <form id="contributions-update-form">
            <div id="contributions-list-container" class="scroll-list">
                <!-- Inputs generated by JS -->
            </div>
            <button type="submit">Update Contributions</button>
        </form>
    </div>
</div>

<script src="/static/js/app.js"></script>
<script src="/static/js/editor.js"></script>

</body>
</html>
