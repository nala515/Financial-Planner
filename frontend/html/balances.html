<!DOCTYPE html>
<html>
<head>
    <title>Balances - Finance Tracker</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<nav>
    <a href="/">Home</a>
    <a href="/accounts">Accounts</a>
    <a href="/balances">Balances</a>
    <a href="/contributions">Contributions</a>
    <a href="/summary">Summary</a>
</nav>

<h1>Monthly Balances</h1>

<label for="account-selector">Select account</label>
<select id="account-selector"></select>

<div id="balances"></div>

<script src="/static/app.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {
    loadBalances();

    const selector = document.getElementById("account-selector");
    const balances = document.getElementById("balances");

    selector.addEventListener("change", async (event) => {
        await loadBalancesForAccount(
            event.target.value,
            balances
        );
    });
});
</script>

</body>
</html>
