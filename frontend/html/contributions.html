<!DOCTYPE html>
<html>
<head>
    <title>Contributions - Finance Tracker</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<nav>
    <a href="/">Home</a>
    <a href="/accounts">Accounts</a>
    <a href="/balances">Balances</a>
    <a href="/contributions">Contributions</a>
    <a href="/summary">Summary</a>
</nav>

<h1>Monthly Contributions</h1>

<label for="account-selector">Select account</label>
<select id="account-selector"></select>

<div id="contributions"></div>

<script src="/static/js/app.js"></script>
<script src="/static/js/contributions.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {
    loadContributions();

    const selector = document.getElementById("account-selector");
    const contributions = document.getElementById("contributions");

    selector.addEventListener("change", async (event) => {
        setSelectedAccountId(event.target.value);
        await loadContributionsForAccount(
            event.target.value,
            contributions
        );
    });
});
</script>

</body>
</html>
