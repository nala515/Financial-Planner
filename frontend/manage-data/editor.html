<!DOCTYPE html>
<html>
<head>
    <title>Editor - Finance Tracker</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="/static/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body data-page="editor">

<div id="nav-container"></div>
<h1>Edit Database</h1>

<div class="editor-panel">
  <div class="range-controls">
    <label>From <input type="month" id="range-start"></label>
    <label>To <input type="month" id="range-end"></label>
  </div>

  <textarea id="csv-output" readonly rows="20" placeholder="Loading missing entries..."></textarea>
  <button id="copy-btn">Copy to clipboard</button>
  <span id="copy-status"></span>
</div>

<script src="/static/shared/app.js"></script>
<script src="/static/shared/nav.js"></script>
<script src="/static/manage-data/editor.js"></script>

</body>
</html>
